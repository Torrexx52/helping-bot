# Копия на сервере: /opt/helping-bot/config/leads.yml
# После правки: команда /reload в боте (или docker compose restart bot).
#
# Слова в geo_words, keywords и stop_words сравниваются с НАЧАЛОМ слова в тексте, без учёта
# регистра и «ё»: «газел» ловит «газель», «газели», «газелью». Фразу из нескольких слов можно
# писать целиком: «вывоз мусора».

scout:
  # Разведка ищет только чаты ЖК (жильцы домов и комплексов Воронежа и области).
  # Остальные типы площадок в таблицу не берутся. Чтобы снова брать все — only_types: [].
  only_types:
    - ЖК-группа ТГ
  # Сколько чатов ЖК набрать за один запуск. Мёртвые и клоны в счёт не идут.
  target: 60

  # Общие запросы. За один запуск берётся не больше SCOUT_QUERIES_PER_RUN запросов (вместе с
  # запросами по списку ЖК ниже); запуск останавливается раньше, если цель набрана.
  # Следующий запуск продолжает с того места, где остановился прошлый.
  queries:
    - ЖК Воронеж
    - Воронеж ЖК
    - ЖК Воронеж чат
    - ЖК Воронеж соседи
    - жилой комплекс Воронеж
    - жильцы Воронеж
    - чат жильцов Воронеж
    - соседи Воронеж
    - чат дома Воронеж
    - новостройка Воронеж
    - дольщики Воронеж
    - ЖК врн
    - ЖК vrn
    - ЖК Отрадное
    - ЖК Шилово
    - ЖК Новая Усмань
    - ЖК Ямное
    - ЖК Бабяково
    - ЖК Семилуки
    - ЖК Нововоронеж
    - ЖК Рамонь
    - ЖК Лиски
    - ЖК Россошь
    - ЖК Борисоглебск

  # Названия ЖК. Каждое подставляется в шаблоны complex_queries и даёт поисковые запросы;
  # чат, в названии которого есть такое имя, считается чатом ЖК. Список неполный — дополняйте.
  complex_queries:
    - "ЖК {name}"
    - "{name} Воронеж"
  complexes:
    - Лазурный
    - Озерки
    - Яблоневые сады
    - Европейский
    - Галактика
    - Финский квартал
    - Гран-При
    - Ботанический сад
    - Новое Отрадное
    - Рождественский
    - Дельфин
    - Ласточкино
    - Мандарин
    - Молодёжный
    - Боровое
    - Славяноград
    - Высота
    - Бунин
    - Черёмушки
    - 9 Ярдов
    - Олимпийский
    - Острова
    - Современник
    - Процветание
    - Пять звёзд
    - Московский квартал
    - Крымский квартал
    - Ленинградский квартал
    - Каскад
    - Грин Парк
    - Легенда
    - Ключи
    - Атмосфера
    - Трамвай желаний
    - Суворов-Сити
    - Скандинавия
    - Городские сады
    - Никитинские сады
    - Задонье
    - Заря
    - Алые Паруса
    - Чехов
    - 8 Элемент
    - Мармелад
    - Домино
    - Поколение
    - Флора
    - Южный Сити
    - Притяжение
    - Тенистый
    - Подгорное
    - Подклетное
    - Репное

  # Слова, по которым чат признаётся чатом ЖК или дома (без ИИ) — в названии или описании.
  complex_words:
    - жк
    - жилой комплекс
    - жилого комплекса
    - жильц
    - домовой чат
    - чат дома
    - наш дом
    - совет дома
    - собственник
    - дольщик
    - новостройк
    - тсж
    - тсн
    - микрорайон
    - мкр

  # Какие площадки не брать в таблицу. Барахолки отсеиваются по умолчанию: там продают вещи,
  # а не ищут перевозчика. Чтобы вернуть их, напишите skip_types: [].
  skip_types:
    - Барахолка ТГ
  # Чаты, в названии или описании которых есть эти слова, тоже пропускаются.
  skip_words:
    - барахолк
    - купи-продай
    - купи продай
    - отдам даром
    - авито
    - вакансии
    - работа в воронеже
    - знакомств
    - крипт
    - ставки

  # Живость и тактика — по последним `history` сообщениям группы, без вступления.
  history: 100            # 0 — историю не читать
  monitor_week: 100       # «живой» для мониторинга заявок: сообщений людей за 7 дней…
  monitor_authors: 20     # …и разных авторов за 7 дней
  dead_week: 7            # меньше сообщений за 7 дней — чат мёртвый
  ads_min: 2              # столько разных участников с объявлениями услуг — реклама терпима

  # Площадка считается воронежской, если в названии или описании есть одно из этих слов.
  # Для чата ЖК город ищется ещё в закрепе и последних сообщениях. Нет нигде — решает ИИ;
  # без ИИ такая площадка отсеивается. Названия ЖК, которых нет в других городах, можно
  # дописать сюда — тогда чат с таким названием берётся и без слова «Воронеж».
  geo_words:
    - воронеж
    - врн
    - vrn
    - voronezh
    - коминтерн
    - левый берег
    - левобереж
    - советский район
    - железнодорожный район
    - ленинский район
    - шилово
    - отрадное
    - придонской
    - подгорное
    - подклетное
    - сомово
    - боровое
    - тенистый
    - репное
    - ямное
    - бабяково
    - нововоронеж
    - семилук
    - рамонь
    - усмань
    - лиски
    - россош
    - борисоглебск
    - вгу
    - вгту
    - финский квартал
    - яблоневые сады
    - новое отрадное
    - ласточкино
    - славяноград
    - 9 ярдов

monitor:
  # Грубый фильтр: сообщение идёт к ИИ, только если в нём есть одно из этих слов…
  # Список широкий намеренно: лишнее отсеет ИИ, а пропущенную заявку уже не вернуть.
  keywords:
    # переезд
    - переезд
    - переезж
    - переех
    - съезжа
    - съехать
    - мувинг
    # перевезти, в том числе с частой опечаткой «перевести диван»
    - перевез
    - перевоз
    - перевести
    - транспортиров
    - межгород
    # груз, грузчики, грузовое такси, грузоперевозки, грузовик, погрузка, разгрузка
    - груз
    - погруз
    - разгруз
    - выгруз
    - догруз
    - такелаж
    - разнорабоч
    # машины
    - газел
    - gazel
    - фургон
    - портер
    - каблучок
    - бортов
    - фура
    - самосвал
    - манипулятор
    - нужна машина
    - нужен транспорт
    # вывезти, привезти, поднять
    - вывезти
    - вывоз
    - доставить
    - довезти
    - отвезти
    - привезти
    - увезти
    - вынести
    - вынос
    - занести
    - поднять на этаж
    - подъем на этаж
    - утилизац

  # …и нет ни одного из этих (так пишут конкуренты, а не клиенты). Только то, что клиент
  # сам не напишет: «недорого» и «услуги» сюда нельзя — так пишут и те, кто ищет перевозчика.
  stop_words:
    - предлагаю
    - предлагаем
    - оказываем
    - выполним
    - выполняем
    - звоните
    - обращайтесь
    - работаем без выходных
    - круглосуточно
    - наши цены
    - прайс
    - от 500
    - любой сложности
    - быстро и качественно
    - без посредников
    - опытные грузчики
    - аккуратные грузчики
    - вакансия
    - требуется водитель
