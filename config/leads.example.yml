# Копия на сервере: /opt/helping-bot/config/leads.yml
# После правки: команда /reload в боте (или docker compose restart bot).
#
# Слова в geo_words, keywords и stop_words сравниваются с НАЧАЛОМ слова в тексте, без учёта
# регистра и «ё»: «газел» ловит «газель», «газели», «газелью». Фразу из нескольких слов можно
# писать целиком: «вывоз мусора».

scout:
  # Поисковые запросы разведки. За один запуск берётся не больше SCOUT_QUERIES_PER_RUN,
  # следующий запуск продолжает с того места, где остановился прошлый.
  queries:
    # Ищем не клоны ЖК, а устоявшиеся чаты, где люди реально общаются, и доски услуг.
    # Тактика 1 (ловить заявки) — живые городские, районные и тематические чаты.
    # Тактика 2 (дать объявление) — доски услуг и чаты, где участники уже публикуют объявления.
    # Общегородские
    - Воронеж чат
    - чат Воронежа
    - Воронеж общение
    - Воронеж онлайн
    - Воронеж 36
    - vrn chat
    - Воронеж жители
    - Воронеж соседи
    # Те, кто скоро переезжает: аренда, недвижимость, приезжие
    - аренда квартир Воронеж
    - снять квартиру Воронеж
    - сдам квартиру Воронеж
    - недвижимость Воронеж
    - переезд Воронеж
    - переезд в Воронеж
    - релокация Воронеж
    # Тематические: мамы, студенты, дачники, ремонт
    - мамы Воронежа
    - мамочки Воронеж
    - студенты Воронеж
    - общежитие Воронеж
    - ВГУ
    - ВГТУ
    - дачники Воронеж
    - СНТ Воронеж
    - ремонт Воронеж
    - стройка Воронеж
    - мебель Воронеж
    # Доски услуг (здесь объявления — норма)
    - услуги Воронеж
    - мастера Воронеж
    - объявления Воронеж
    - реклама Воронеж
    - бизнес Воронеж
    - предприниматели Воронеж
    # Районы и область — только общие чаты, без отдельных ЖК
    - Левый берег Воронеж
    - Северный Воронеж
    - Коминтерновский Воронеж
    - Советский район Воронеж
    - Железнодорожный район Воронеж
    - Ленинский район Воронеж
    - Шилово Воронеж
    - Отрадное Воронеж
    - Нововоронеж
    - Семилуки
    - Рамонь
    - Новая Усмань
    - Лиски
    - Россошь
    - Борисоглебск

  # Какие площадки не брать в таблицу. Барахолки отсеиваются по умолчанию: там продают вещи,
  # а не ищут перевозчика. Чтобы вернуть их, напишите skip_types: [].
  skip_types:
    - Барахолка ТГ
  # Чаты, в названии или описании которых есть эти слова, тоже пропускаются.
  skip_words:
    - барахолк
    - купи-продай
    - купи продай
    - отдам даром
    - авито
    - вакансии
    - работа в воронеже
    - знакомств
    - крипт
    - ставки

  # Живость и тактика — по последним `history` сообщениям группы, без вступления.
  history: 100            # 0 — историю не читать
  monitor_week: 100       # «живой» для мониторинга заявок: сообщений людей за 7 дней…
  monitor_authors: 20     # …и разных авторов за 7 дней
  dead_week: 7            # меньше сообщений за 7 дней — чат мёртвый
  ads_min: 2              # столько разных участников с объявлениями услуг — реклама терпима

  # Площадка считается воронежской, если в названии или описании есть одно из этих слов.
  # Нет ни одного — решает ИИ; без ИИ такая площадка отсеивается.
  geo_words:
    - воронеж
    - врн
    - vrn
    - voronezh
    - коминтерн
    - левый берег
    - левобереж
    - северный
    - советский район
    - железнодорожный район
    - ленинский район
    - шилово
    - отрадное
    - придонской
    - подгорное
    - сомово
    - боровое
    - тенистый
    - нововоронеж
    - семилук
    - рамонь
    - усмань
    - лиски
    - россош
    - борисоглеб
    - вгу
    - вгту
    - лазурный
    - озерки
    - финский квартал
    - яблоневые сады
    - гран-при
    - ботанический сад

monitor:
  # Грубый фильтр: сообщение идёт к ИИ, только если в нём есть одно из этих слов…
  keywords:
    - переезд
    - переезж
    - переех
    - перевез
    - перевоз
    - газел
    - грузчик
    - грузотакси
    - грузовое такси
    - грузоперевоз
    - грузовик
    - грузов
    - вывезти
    - вывоз
    - доставить
    - довезти
    - отвезти
    - привезти
    - увезти
    - нужна машина
    - нужен фургон
    - манипулятор

  # …и нет ни одного из этих (так пишут конкуренты, а не клиенты).
  stop_words:
    - предлагаю
    - предлагаем
    - услуги
    - недорого
    - звоните
    - обращайтесь
    - оказываем
    - выполним
    - выполняем
    - работаем без выходных
    - наши цены
    - от 500
    - прайс
    - заказать газель
    - вакансия
    - требуется водитель
    - требуются грузчики
