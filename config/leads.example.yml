# Копия на сервере: /opt/helping-bot/config/leads.yml
# После правки: команда /reload в боте (или docker compose restart bot).
#
# Слова в geo_words, keywords и stop_words сравниваются с НАЧАЛОМ слова в тексте, без учёта
# регистра и «ё»: «газел» ловит «газель», «газели», «газелью». Фразу из нескольких слов можно
# писать целиком: «вывоз мусора».

scout:
  # Поисковые запросы разведки. За один запуск берётся не больше SCOUT_QUERIES_PER_RUN,
  # следующий запуск продолжает с того места, где остановился прошлый.
  queries:
    - Воронеж ЖК
    - Воронеж чат
    - Воронеж соседи
    - переезд Воронеж
    - барахолка Воронеж
    - объявления Воронеж
    - отдам даром Воронеж
    - Воронеж мебель
    - Воронеж новостройки
    - Левый берег Воронеж
    - Северный Воронеж
    - Коминтерновский Воронеж
    - Советский район Воронеж
    - Железнодорожный район Воронеж
    - Ленинский район Воронеж
    - Центральный район Воронеж
    - Шилово Воронеж
    - Отрадное Воронеж
    - Придонской
    - Подгорное Воронеж
    - Сомово
    - Боровое Воронеж
    - Тенистый Воронеж
    - Нововоронеж
    - Семилуки
    - ЖК Лазурный Воронеж
    - ЖК Европейский Воронеж
    - ЖК Озерки Воронеж
    - ЖК Финский квартал Воронеж
    - ЖК Гран-При Воронеж
    - ЖК Ботанический сад Воронеж
    - ЖК Бунин Воронеж
    - ЖК Яблоневые сады
    - ЖК Черёмушки Воронеж
    - ЖК Высота Воронеж
    - ЖК Галактика Воронеж

  # Площадка считается воронежской, если в названии или описании есть одно из этих слов.
  # Нет ни одного — решает ИИ; без ИИ такая площадка отсеивается.
  geo_words:
    - воронеж
    - врн
    - vrn
    - voronezh
    - коминтерн
    - левый берег
    - левобереж
    - северный
    - советский район
    - железнодорожный район
    - ленинский район
    - шилово
    - отрадное
    - придонской
    - подгорное
    - сомово
    - боровое
    - тенистый
    - нововоронеж
    - семилук
    - лазурный
    - озерки
    - финский квартал
    - яблоневые сады
    - гран-при
    - ботанический сад

monitor:
  # Грубый фильтр: сообщение идёт к ИИ, только если в нём есть одно из этих слов…
  keywords:
    - переезд
    - переезж
    - переех
    - перевез
    - перевоз
    - газел
    - грузчик
    - грузотакси
    - грузовое такси
    - грузоперевоз
    - грузовик
    - грузов
    - вывезти
    - вывоз
    - доставить
    - довезти
    - отвезти
    - привезти
    - увезти
    - нужна машина
    - нужен фургон
    - манипулятор

  # …и нет ни одного из этих (так пишут конкуренты, а не клиенты).
  stop_words:
    - предлагаю
    - предлагаем
    - услуги
    - недорого
    - звоните
    - обращайтесь
    - оказываем
    - выполним
    - выполняем
    - работаем без выходных
    - наши цены
    - от 500
    - прайс
    - заказать газель
    - вакансия
    - требуется водитель
    - требуются грузчики
