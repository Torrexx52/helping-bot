[project]
name = "helping-bot"
version = "2.0.0"
description = "Личный Telegram-бот: очередь постов для соцсетей из GitHub-репозиториев, поиск чатов и заявок"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "python-frontmatter>=1.1",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tzdata>=2024.1",
    "Telethon>=1.36,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501", "ASYNC109"]
